<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Universe — Cosmic Calendar</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: #f2f4ff;
  background: #01030b;
}
#space { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,8,.15) 65%, rgba(0,0,8,.55) 100%); }

/* 🌟 캘린더 크기를 더 넉넉하게 키움 */
.calendar {
  position: relative; z-index: 2;
  width: min(1300px, calc(100vw - 30px));
  height: min(850px, calc(100vh - 30px));
  margin: 15px auto;
  padding: 24px 28px;
  border: 1px solid rgba(158, 125, 255, .38);
  border-radius: 24px;
  background: rgba(3, 7, 28, .52);
  backdrop-filter: blur(8px);
  box-shadow:
    0 0 0 1px rgba(60, 145, 255, .08) inset,
    0 25px 90px rgba(0, 0, 0, .5),
    0 0 55px rgba(80, 75, 255, .12);
}
.header {
  height: 65px; display: flex; align-items: center; justify-content: center;
  position: relative; border-bottom: 1px solid rgba(177, 164, 255, .22);
  margin-bottom: 12px;
}
.title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 34px; letter-spacing: .18em; font-weight: 500;
  text-shadow: 0 0 18px rgba(205, 180, 255, .35);
}
.nav { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; }
.nav button {
  pointer-events: auto;
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid rgba(155, 120, 255, .7);
  background: rgba(5, 8, 35, .45); color: #fff; font-size: 28px; line-height: 1;
  cursor: pointer; box-shadow: 0 0 20px rgba(110, 85, 255, .12);
}
.nav button:hover { background: rgba(85, 80, 255, .18); box-shadow: 0 0 25px rgba(100, 100, 255, .3); }
.nav .today {
  width: auto; padding: 0 20px; border-radius: 28px; font-size: 15px;
  position: absolute; right: 54px; transform: none;
}
.week { 
  display: grid; grid-template-columns: repeat(7, 1fr);
  height: 38px; align-items: center; text-align: center;
  font-size: 15px; letter-spacing: .05em; color: #cbd0ef;
}
.week div:first-child { color: #ff4fbd; }
.week div:last-child { color: #39aaff; }

/* 🌟 반듯하고 고정된 6주 그리드 레이아웃 */
.days { 
  height: calc(100% - 116px); 
  display: grid;
  grid-template-rows: repeat(6, 1fr);
  grid-template-columns: repeat(7, 1fr);
  border-top: 1px solid rgba(128, 139, 210, .22);
  border-left: 1px solid rgba(128, 139, 210, .22);
}

.day {
  position: relative;
  padding: 8px;
  padding-top: 32px; /* 날짜 숫자 공간 확보 */
  border-right: 1px solid rgba(128, 139, 210, .22);
  border-bottom: 1px solid rgba(128, 139, 210, .22);
  background: rgba(0, 6, 28, .15);
  display: flex;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
}
.day:hover { background: rgba(64, 80, 180, .08); }

.num {
  position: absolute; top: 8px; right: 8px;
  font-size: 16px; line-height: 1; font-weight: 400;
  color: #edf0ff; z-index: 5;
}
.day.sun .num { color: #ff4db9; }
.day.sat .num { color: #39aaff; }
.muted { opacity: .28; }
.todayDate .num {
  width: 26px; height: 26px; top: 6px; right: 6px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1.5px solid #9b5cff;
  box-shadow: 0 0 8px rgba(108, 99, 255, .85);
  background: rgba(76, 48, 170, .16); font-size: 14px;
}

/* 🌟 일정 아이템 스타일 */
.event-item {
  font-size: 11px;
  padding: 3px 6px;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 500;
  cursor: pointer;
}
.event-item.calendar { background: rgba(69, 169, 255, 0.22); border-left: 3px solid #45a9ff; color: #c4e4ff; }
.event-item.task { background: rgba(255, 91, 189, 0.22); border-left: 3px solid #ff5bbd; color: #ffcceb; }
.event-item.exam { background: rgba(180, 119, 255, 0.22); border-left: 3px solid #b477ff; color: #e5ccff; }

/* 🌟 "+N개 더보기" 버튼 스타일 */
.more-btn {
  font-size: 10px;
  color: #bfaaff;
  background: rgba(155, 120, 255, 0.15);
  padding: 2px 6px;
  border-radius: 4px;
  text-align: center;
  cursor: pointer;
  border: 1px dashed rgba(155, 120, 255, 0.4);
}
.more-btn:hover {
  background: rgba(155, 120, 255, 0.3);
  color: #fff;
}

/* 🌟 숨겨진 일정을 보여주는 팝업 모달창 */
#modal {
  display: none;
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(1, 3, 11, 0.7);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center;
}
.modal-content {
  width: 340px; max-height: 400px;
  background: #080c24;
  border: 1px solid rgba(158, 125, 255, .5);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8);
  display: flex; flex-direction: column; gap: 10px;
}
.modal-header {
  font-size: 16px; font-weight: bold; color: #fff;
  border-bottom: 1px solid rgba(158, 125, 255, .2);
  padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
}
.modal-close {
  background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer;
}
.modal-close:hover { color: #fff; }
.modal-body {
  overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
  scrollbar-width: thin; scrollbar-color: rgba(155, 120, 255, 0.4) transparent;
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="vignette"></div>

<section class="calendar">
  <header class="header">
    <div class="nav">
      <button id="prev" aria-label="previous month">‹</button>
      <button id="next" aria-label="next month">›</button>
      <button id="today" class="today">Today</button>
    </div>
    <div id="title" class="title"></div>
  </header>

  <div class="week">
    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
  </div>
  <div id="days" class="days"></div>
</section>

<!-- 전체 일정 보기 모달 팝업 -->
<div id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <span id="modal-date-title">날짜 일정</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-event-list"></div>
  </div>
</div>

<script>
const canvas=document.getElementById("space"),ctx=canvas.getContext("2d");
let W,H,D,stars=[],clouds=[],meteors=[],t=0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
  canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.min(360,Math.max(130,W*H/9000))},()=>({
    x:Math.random()*W,y:Math.random()*H,r:rnd(.25,1.15),a:rnd(.25,.9),p:Math.random()*6.28
  }));
  clouds=Array.from({length:36},()=>({
    x:rnd(-100,W+100),y:rnd(-50,H+50),r:rnd(35,115),pink:Math.random()<.5
  }));
}

function galaxy(){
  const cx=W*.54,cy=H*.48,base=Math.min(W,H),rx=base*.43,ry=base*.17;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.17);ctx.globalCompositeOperation="screen";

  let halo=ctx.createRadialGradient(0,0,0,0,0,rx*1.2);
  halo.addColorStop(0,"rgba(255,100,225,.19)");
  halo.addColorStop(.25,"rgba(75,125,255,.12)");
  halo.addColorStop(.6,"rgba(100,55,230,.035)");
  halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,rx*1.2,0,7);ctx.fill();ctx.restore();

  for(let arm=0;arm<2;arm++){
    ctx.beginPath();
    for(let i=0;i<760;i++){
      const q=i/759,a=q*Math.PI*6+arm*Math.PI+.16*Math.sin(q*12),r=rx*(.07+q*.93);
      const px=Math.cos(a)*r,py=Math.sin(a)*r*(ry/rx);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.strokeStyle=arm===0?"rgba(55,150,255,.18)":"rgba(255,60,205,.16)";
    ctx.lineWidth=base*.05;
    ctx.shadowBlur=base*.06;
    ctx.shadowColor=arm===0?"rgba(40,140,255,.38)":"rgba(255,50,205,.35)";
    ctx.stroke();ctx.shadowBlur=0;
  }

  let band=ctx.createRadialGradient(0,0,0,0,0,rx);
  band.addColorStop(0,"rgba(255,255,255,.78)");
  band.addColorStop(.08,"rgba(255,165,235,.43)");
  band.addColorStop(.2,"rgba(70,145,255,.13)");
  band.addColorStop(.65,"rgba(50,80,220,.02)");
  band.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=band;ctx.beginPath();ctx.arc(0,0,rx,0,7);ctx.fill();ctx.restore();

  const core=ctx.createRadialGradient(0,0,0,0,0,base*.105);
  core.addColorStop(0,"rgba(255,255,255,.98)");
  core.addColorStop(.13,"rgba(255,225,252,.92)");
  core.addColorStop(.34,"rgba(255,95,220,.42)");
  core.addColorStop(.7,"rgba(80,100,255,.08)");
  core.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,base*.105,0,7);ctx.fill();
  ctx.restore();
}

function background(){
  let g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.8);
  g.addColorStop(0,"#090a25");g.addColorStop(.45,"#030820");g.addColorStop(1,"#010208");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation="screen";
  for(const p of clouds){
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    if(p.pink){g.addColorStop(0,"rgba(255,45,195,.055)");g.addColorStop(1,"rgba(255,45,195,0)")}
    else{g.addColorStop(0,"rgba(35,125,255,.06)");g.addColorStop(1,"rgba(35,125,255,0)")}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }

  for(const s of stars){
    ctx.fillStyle=`rgba(225,235,255,${s.a*(.72+.28*Math.sin(t*1.7+s.p))})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  galaxy();
}

function spawnMeteor(){
  if(meteors.length>=3)return;
  const a=rnd(.38,.68),speed=rnd(7,12);
  meteors.push({
    x:rnd(-80,W),y:rnd(-80,H*.35),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    life:0,max:rnd(42,70),len:rnd(50,115),
    color:["#3ca8ff","#ff43bd","#9d62ff","#63eaff"][Math.floor(Math.random()*4)]
  });
}
function meteorsDraw(){
  ctx.globalCompositeOperation="screen";
  for(const m of meteors){
    m.x+=m.vx;m.y+=m.vy;m.life++;
    const mag=Math.hypot(m.vx,m.vy),ux=m.vx/mag,uy=m.vy/mag;
    const g=ctx.createLinearGradient(m.x-ux*m.len,m.y-uy*m.len,m.x,m.y);
    g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.72,m.color);g.addColorStop(1,"#fff");
    ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(m.x-ux*m.len,m.y-uy*m.len);ctx.lineTo(m.x,m.y);ctx.stroke();
  }
  meteors=meteors.filter(m=>m.life<m.max&&m.x<W+180&&m.y<H+180);
  if(Math.random()<.007)spawnMeteor();
}
function loop(){
  t+=.016;background();meteorsDraw();ctx.globalCompositeOperation="source-over";requestAnimationFrame(loop);
}

const API_URL = "https://my-universe-notion-api.121212jms.workers.dev/calendar";
let remoteEvents = [];

async function loadEvents() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`API ${response.status}`);
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || "API error");
    remoteEvents = Array.isArray(data.events) ? data.events : [];
  } catch (error) {
    console.error("Calendar API error:", error);
    remoteEvents = [];
  }
}

function eventTypeClass(type) {
  if (type === "exam") return "exam";
  if (type === "calendar") return "calendar";
  return "task";
}
function eventLabel(type) {
  if (type === "exam") return "시험";
  if (type === "calendar") return "일정";
  return "과제";
}

const title = document.getElementById("title");
const daysContainer = document.getElementById("days");
const modal = document.getElementById("modal");
const modalDateTitle = document.getElementById("modal-date-title");
const modalEventList = document.getElementById("modal-event-list");
document.getElementById("modal-close").onclick = () => modal.style.display = "none";

let view = new Date(); view.setDate(1);

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  const months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

  title.textContent = `${months[m]} ${y}`;
  daysContainer.innerHTML = "";

  const first = new Date(y, m, 1).getDay();
  const cellEvents = Array.from({length: 42}, () => []);

  // 날짜별로 포함되는 일정 분류하기
  remoteEvents.forEach(ev => {
    if(!ev.date?.start) return;
    const sDate = new Date(String(ev.date.start).slice(0,10) + "T00:00:00");
    const eDate = new Date(String(ev.date.end || ev.date.start).slice(0,10) + "T00:00:00");

    for(let i=0; i<42; i++) {
      const cellDate = new Date(y, m, 1 - first + i);
      cellDate.setHours(0,0,0,0);
      if(cellDate >= sDate && cellDate <= eDate) {
        cellEvents[i].push(ev);
      }
    }
  });

  // 42개 칸 생성 및 3개 초과 시 "+N개 더보기" 처리
  for(let i=0; i<42; i++) {
    const cellDate = new Date(y, m, 1 - first + i);
    const num = cellDate.getDate();
    const muted = cellDate.getMonth() !== m;

    const dayEl = document.createElement("div");
    dayEl.className = "day";
    if(muted) dayEl.classList.add("muted");
    if(i%7 === 0) dayEl.classList.add("sun");
    if(i%7 === 6) dayEl.classList.add("sat");

    const today = new Date();
    if(!muted && num === today.getDate() && cellDate.getMonth() === today.getMonth() && cellDate.getFullYear() === today.getFullYear()){
      dayEl.classList.add("todayDate");
    }

    const numEl = document.createElement("div");
    numEl.className = "num";
    numEl.textContent = num;
    dayEl.appendChild(numEl);

    const evs = cellEvents[i];
    const maxShow = 2; // 한 칸에 최대 보여줄 일정 개수

    evs.slice(0, maxShow).forEach(ev => {
      const item = document.createElement("div");
      item.className = `event-item ${eventTypeClass(ev.type)}`;
      item.textContent = `${eventLabel(ev.type)} · ${ev.title || "제목 없음"}`;
      item.title = `${eventLabel(ev.type)} · ${ev.title || "제목 없음"}`;
      dayEl.appendChild(item);
    });

    if(evs.length > maxShow) {
      const moreBtn = document.createElement("div");
      moreBtn.className = "more-btn";
      moreBtn.textContent = `+${evs.length - maxShow}개 더보기`;
      moreBtn.onclick = (e) => {
        e.stopPropagation();
        modalDateTitle.textContent = `${cellDate.getMonth()+1월} ${cellDate.getDate()}일 일정`;
        modalEventList.innerHTML = "";
        evs.forEach(ev => {
          const mItem = document.createElement("div");
          mItem.className = `event-item ${eventTypeClass(ev.type)}`;
          mItem.textContent = `${eventLabel(ev.type)} · ${ev.title || "제목 없음"}`;
          modalEventList.appendChild(mItem);
        });
        modal.style.display = "flex";
      };
      dayEl.appendChild(moreBtn);
    }

    daysContainer.appendChild(dayEl);
  }
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth()-1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth()+1); render(); };
document.getElementById("today").onclick = () => { view = new Date(); view.setDate(1); render(); };

addEventListener("resize", resize);
resize(); loadEvents().finally(() => render()); spawnMeteor(); loop();
</script>
</body>
</html>
