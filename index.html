<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Universe — Cosmic Calendar</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  color: #f2f4ff;
  background: #01030b;
}
#space { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,8,.15) 65%, rgba(0,0,8,.55) 100%); }

.calendar {
  position: relative; z-index: 2;
  width: min(1150px, calc(100vw - 40px));
  height: min(860px, calc(100vh - 24px));
  margin: 12px auto;
  padding: 28px 28px 24px;
  border: 1px solid rgba(158, 125, 255, .38);
  border-radius: 24px;
  background: rgba(3, 7, 28, .46);
  backdrop-filter: blur(5px);
  box-shadow:
    0 0 0 1px rgba(60, 145, 255, .08) inset,
    0 25px 90px rgba(0, 0, 0, .42),
    0 0 55px rgba(80, 75, 255, .10);
}
.header {
  height: 76px; display: flex; align-items: center; justify-content: center;
  position: relative; border-bottom: 1px solid rgba(177, 164, 255, .22);
  margin-bottom: 18px;
}
.title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 38px; letter-spacing: .18em; font-weight: 500;
  text-shadow: 0 0 18px rgba(205, 180, 255, .35);
}
.nav { position: absolute; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; }
.nav button {
  pointer-events: auto;
  width: 50px; height: 50px; border-radius: 50%;
  border: 1px solid rgba(155, 120, 255, .7);
  background: rgba(5, 8, 35, .45); color: #fff; font-size: 32px; line-height: 1;
  cursor: pointer; box-shadow: 0 0 20px rgba(110, 85, 255, .12);
}
.nav button:hover { background: rgba(85, 80, 255, .18); box-shadow: 0 0 25px rgba(100, 100, 255, .3); }
.nav .today {
  width: auto; padding: 0 22px; border-radius: 28px; font-size: 16px;
  position: absolute; right: 58px; transform: none;
}
.offline-status {
  position: absolute; top: -18px; font-size: 11px; color: #ffab40;
  background: rgba(255, 171, 64, 0.15); border: 1px solid rgba(255, 171, 64, 0.3);
  padding: 2px 10px; border-radius: 12px; display: none;
}

.week { 
  display: grid; grid-template-columns: repeat(7, 1fr);
  height: 48px; align-items: center; text-align: center;
  font-size: 16px; letter-spacing: .05em; color: #cbd0ef;
}
.week div:first-child { color: #ff4fbd; }
.week div:last-child { color: #39aaff; }

/* ===== 🚀 달력 그리드 구조 ===== */
.days { 
  height: calc(100% - 134px); 
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  border-top: 1px solid rgba(128, 139, 210, .22);
  border-left: 1px solid rgba(128, 139, 210, .22);
  scrollbar-width: thin;
  scrollbar-color: rgba(155, 120, 255, 0.4) transparent;
}
.days::-webkit-scrollbar { width: 6px; }
.days::-webkit-scrollbar-thumb { background: rgba(155, 120, 255, 0.4); border-radius: 6px; }

.week-row {
  position: relative;
  flex: 1 1 calc(100% / 6);
  min-height: 110px;
}

.bg-cells {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  pointer-events: none;
}
.day {
  position: relative;
  border-right: 1px solid rgba(128, 139, 210, .22);
  border-bottom: 1px solid rgba(128, 139, 210, .22);
  pointer-events: auto;
  cursor: pointer;
}
.day:hover { background: rgba(64, 80, 180, .12); }

.num {
  position: absolute; top: 10px; right: 10px;
  font-size: 18px; line-height: 1; font-weight: 400;
  color: #edf0ff; z-index: 5;
}
.day.sun .num { color: #ff4db9; }
.day.sat .num { color: #39aaff; }
.muted { opacity: .28; }
.todayDate .num {
  width: 29px; height: 29px; top: 7px; right: 7px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; border: 1.5px solid #9b5cff;
  box-shadow: 0 0 8px rgba(108, 99, 255, .85);
  background: rgba(76, 48, 170, .16); font-size: 16px;
}

/* ===== 🗓️ 일정 레이어 및 배지 ===== */
.events-layer {
  position: relative;
  margin-top: 38px;
  margin-bottom: 4px;
  pointer-events: none;
  height: 84px;
  overflow: hidden;
}

.event-range {
  position: absolute;
  top: calc(var(--lane, 0) * 26px);
  height: 22px; 
  line-height: 22px;
  padding: 0 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 11px;
  font-weight: 500;
  pointer-events: auto;
  color: #fff;
  cursor: pointer;
}

.event-range.calendar { background: rgba(69, 169, 255, 0.25); border-left: 3px solid #45a9ff; color: #c4e4ff; }
.event-range.task { background: rgba(255, 91, 189, 0.25); border-left: 3px solid #ff5bbd; color: #ffcceb; }
.event-range.exam { background: rgba(180, 119, 255, 0.25); border-left: 3px solid #b477ff; color: #e5ccff; }

.event-range.range-both { margin-left: 4px; margin-right: 4px; border-radius: 4px; }
.event-range.range-start { margin-left: 4px; margin-right: 0; border-radius: 4px 0 0 4px; border-right: none; }
.event-range.range-end { margin-left: 0; margin-right: 4px; border-radius: 0 4px 4px 0; border-left: none; }
.event-range.range-middle { margin-left: 0; margin-right: 0; border-radius: 0; border-left: none; border-right: none; }

.more-badge {
  position: absolute;
  top: calc(2 * 26px);
  height: 20px;
  line-height: 20px;
  padding: 0 6px;
  font-size: 10px;
  font-weight: 600;
  color: #d1c4ff;
  background: rgba(140, 100, 255, 0.22);
  border: 1px solid rgba(160, 120, 255, 0.4);
  border-radius: 4px;
  cursor: pointer;
  pointer-events: auto;
  z-index: 6;
  text-align: center;
}
.more-badge:hover { background: rgba(160, 120, 255, 0.4); color: #fff; }

/* 상세 일정 모달 */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(2, 4, 15, 0.7);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card {
  width: min(460px, calc(100vw - 32px));
  max-height: 80vh;
  background: rgba(12, 16, 45, 0.94);
  border: 1px solid rgba(160, 130, 255, 0.4);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(120,90,255,0.25);
  display: flex; flex-direction: column;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(160, 130, 255, 0.2);
  padding-bottom: 12px; margin-bottom: 16px;
}
.modal-title { font-size: 18px; font-weight: 600; color: #f0f3ff; }
.modal-close {
  background: none; border: none; color: #a0a8d0; font-size: 24px;
  cursor: pointer; line-height: 1; padding: 0 4px;
}
.modal-close:hover { color: #fff; }
.modal-body { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: 50vh; }
.modal-event-item {
  padding: 10px 12px; border-radius: 8px; font-size: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.modal-event-item.calendar { background: rgba(69, 169, 255, 0.15); border-left: 4px solid #45a9ff; }
.modal-event-item.task { background: rgba(255, 91, 189, 0.15); border-left: 4px solid #ff5bbd; }
.modal-event-item.exam { background: rgba(180, 119, 255, 0.15); border-left: 4px solid #b477ff; }

.notion-link-btn {
  font-size: 11px; color: #bcaeff; background: rgba(150, 120, 255, 0.2);
  border: 1px solid rgba(160, 130, 255, 0.4); padding: 4px 8px; border-radius: 6px;
  text-decoration: none; flex-shrink: 0; transition: background 0.2s;
}
.notion-link-btn:hover { background: rgba(160, 130, 255, 0.4); color: #fff; }

@media(max-width:800px){
  .calendar { width: calc(100vw - 18px); height: calc(100vh - 18px); margin: 9px; padding: 18px; }
  .title { font-size: 25px; letter-spacing: .1em; }
  .nav button { width: 40px; height: 40px; font-size: 25px; }
  .nav .today { padding: 0 14px; font-size: 13px; right: 48px; }
  .day { padding: 8px; }
  .num { top: 8px; right: 8px; font-size: 15px; }
  .todayDate .num { width: 24px; height: 24px; top: 5px; right: 5px; font-size: 13px; }
  .week { font-size: 12px; }
  .events-layer { margin-top: 30px; height: 66px; }
  .event-range { top: calc(var(--lane, 0) * 22px); height: 18px; line-height: 18px; font-size: 9px; padding: 0 4px; }
  .more-badge { top: calc(2 * 22px); height: 18px; line-height: 18px; font-size: 9px; }
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="vignette"></div>

<section class="calendar">
  <header class="header">
    <div id="offlineBadge" class="offline-status">오프라인 캐시 데이터 표시 중</div>
    <div class="nav">
      <button id="prev" aria-label="previous month">‹</button>
      <button id="next" aria-label="next month">›</button>
      <button id="today" class="today">Today</button>
    </div>
    <div id="title" class="title"></div>
  </header>

  <div class="week">
    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
  </div>
  <div id="days" class="days"></div>
</section>

<!-- 일정 상세 모달 -->
<div id="eventModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <div id="modalDate" class="modal-title"></div>
      <button id="modalClose" class="modal-close">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<script>
const canvas=document.getElementById("space"),ctx=canvas.getContext("2d");
let W,H,D,stars=[],clouds=[],meteors=[],t=0;
let isAnimating = true;
let animFrameId = null;

const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
  canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.min(360,Math.max(130,W*H/9000))},()=>({
    x:Math.random()*W,y:Math.random()*H,r:rnd(.25,1.15),a:rnd(.25,.9),p:Math.random()*6.28
  }));
  clouds=Array.from({length:36},()=>({
    x:rnd(-100,W+100),y:rnd(-50,H+50),r:rnd(35,115),pink:Math.random()<.5
  }));
}

function galaxy(){
  const cx=W*.54,cy=H*.48,base=Math.min(W,H),rx=base*.43,ry=base*.17;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.17);ctx.globalCompositeOperation="screen";

  let halo=ctx.createRadialGradient(0,0,0,0,0,rx*1.2);
  halo.addColorStop(0,"rgba(255,100,225,.19)");
  halo.addColorStop(.25,"rgba(75,125,255,.12)");
  halo.addColorStop(.6,"rgba(100,55,230,.035)");
  halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,rx*1.2,0,7);ctx.fill();ctx.restore();

  for(let arm=0;arm<2;arm++){
    ctx.beginPath();
    for(let i=0;i<760;i++){
      const q=i/759,a=q*Math.PI*6+arm*Math.PI+.16*Math.sin(q*12),r=rx*(.07+q*.93);
      const px=Math.cos(a)*r,py=Math.sin(a)*r*(ry/rx);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.strokeStyle=arm===0?"rgba(55,150,255,.18)":"rgba(255,60,205,.16)";
    ctx.lineWidth=base*.05;
    ctx.shadowBlur=base*.06;
    ctx.shadowColor=arm===0?"rgba(40,140,255,.38)":"rgba(255,50,205,.35)";
    ctx.stroke();ctx.shadowBlur=0;
  }

  let band=ctx.createRadialGradient(0,0,0,0,0,rx);
  band.addColorStop(0,"rgba(255,255,255,.78)");
  band.addColorStop(.08,"rgba(255,165,235,.43)");
  band.addColorStop(.2,"rgba(70,145,255,.13)");
  band.addColorStop(.65,"rgba(50,80,220,.02)");
  band.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=band;ctx.beginPath();ctx.arc(0,0,rx,0,7);ctx.fill();ctx.restore();

  const core=ctx.createRadialGradient(0,0,0,0,0,base*.105);
  core.addColorStop(0,"rgba(255,255,255,.98)");
  core.addColorStop(.13,"rgba(255,225,252,.92)");
  core.addColorStop(.34,"rgba(255,95,220,.42)");
  core.addColorStop(.7,"rgba(80,100,255,.08)");
  core.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,base*.105,0,7);ctx.fill();
  ctx.restore();
}

function background(){
  let g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.8);
  g.addColorStop(0,"#090a25");g.addColorStop(.45,"#030820");g.addColorStop(1,"#010208");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation="screen";
  for(const p of clouds){
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    if(p.pink){g.addColorStop(0,"rgba(255,45,195,.055)");g.addColorStop(1,"rgba(255,45,195,0)")}
    else{g.addColorStop(0,"rgba(35,125,255,.06)");g.addColorStop(1,"rgba(35,125,255,0)")}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }

  for(const s of stars){
    ctx.fillStyle=`rgba(225,235,255,${s.a*(.72+.28*Math.sin(t*1.7+s.p))})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  galaxy();
}

function spawnMeteor(){
  if(meteors.length>=3)return;
  const a=rnd(.38,.68),speed=rnd(7,12);
  meteors.push({
    x:rnd(-80,W),y:rnd(-80,H*.35),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    life:0,max:rnd(42,70),len:rnd(50,115),
    color:["#3ca8ff","#ff43bd","#9d62ff","#63eaff"][Math.floor(Math.random()*4)]
  });
}

function meteorsDraw(){
  ctx.globalCompositeOperation="screen";
  for(const m of meteors){
    m.x+=m.vx;m.y+=m.vy;m.life++;
    const mag=Math.hypot(m.vx,m.vy),ux=m.vx/mag,uy=m.vy/mag;
    const g=ctx.createLinearGradient(m.x-ux*m.len,m.y-uy*m.len,m.x,m.y);
    g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.72,m.color);g.addColorStop(1,"#fff");
    ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(m.x-ux*m.len,m.y-uy*m.len);ctx.lineTo(m.x,m.y);ctx.stroke();
  }
  meteors=meteors.filter(m=>m.life<m.max&&m.x<W+180&&m.y<H+180);
  if(Math.random()<.007)spawnMeteor();
}

function loop(){
  if(!isAnimating) return;
  t+=.016; background(); meteorsDraw(); ctx.globalCompositeOperation="source-over";
  animFrameId = requestAnimationFrame(loop);
}

/* ⚡ 배터리 절약: 탭 비활성화 시 애니메이션 일시 정지 */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    isAnimating = false;
    if (animFrameId) cancelAnimationFrame(animFrameId);
  } else {
    if (!isAnimating) {
      isAnimating = true;
      loop();
    }
  }
});

/* API 및 달력 로직 */
const API_URL = "https://my-universe-notion-api.121212jms.workers.dev/calendar";
let remoteEvents = [];

async function loadEvents() {
  const offlineBadge = document.getElementById("offlineBadge");
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`API ${response.status}`);
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || "API error");
    
    remoteEvents = Array.isArray(data.events) ? data.events : [];
    localStorage.setItem("cached_my_universe_events", JSON.stringify(remoteEvents));
    if (offlineBadge) offlineBadge.style.display = "none";
  } catch (error) {
    console.error("Calendar API error:", error);
    const cached = localStorage.getItem("cached_my_universe_events");
    if (cached) {
      remoteEvents = JSON.parse(cached);
      if (offlineBadge) offlineBadge.style.display = "block";
    } else {
      remoteEvents = [];
    }
  }
}

function eventTypeClass(type) {
  if (type === "exam") return "exam";
  if (type === "calendar") return "calendar";
  return "task";
}

function eventLabel(type) {
  if (type === "exam") return "시험";
  if (type === "calendar") return "일정";
  return "과제";
}

function getTimePrefix(dateStr) {
  if (!dateStr || String(dateStr).length <= 10) return "";
  const timePart = String(dateStr).slice(11, 16);
  return timePart ? `[${timePart}] ` : "";
}

function parseLocalDate(dateStr) {
  if (!dateStr) return null;
  const s = String(dateStr).slice(0, 10);
  const parts = s.split("-");
  return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
}

function getDayDiff(d1, d2) {
  const t1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate()).getTime();
  const t2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate()).getTime();
  return Math.round((t1 - t2) / 86400000);
}

const title = document.getElementById("title");
const daysContainer = document.getElementById("days");
const modalOverlay = document.getElementById("eventModal");
const modalDate = document.getElementById("modalDate");
const modalBody = document.getElementById("modalBody");
const modalClose = document.getElementById("modalClose");

let view = new Date(); view.setDate(1);

function openModal(dateObj, dayEvents) {
  const y = dateObj.getFullYear();
  const m = dateObj.getMonth() + 1;
  const d = dateObj.getDate();
  modalDate.textContent = `${y}년 ${m}월 ${d}일 일정 (${dayEvents.length}개)`;
  
  modalBody.innerHTML = "";
  if(dayEvents.length === 0) {
    modalBody.innerHTML = `<div style="text-align:center; color:#8088b0; padding: 20px;">등록된 일정이 없습니다.</div>`;
  } else {
    dayEvents.forEach(ev => {
      const item = document.createElement("div");
      item.className = `modal-event-item ${eventTypeClass(ev.type)}`;
      
      const timeStr = getTimePrefix(ev.date?.start);
      const titleSpan = document.createElement("span");
      titleSpan.style.fontWeight = "600";
      titleSpan.textContent = `${timeStr}[${eventLabel(ev.type)}] ${ev.title || "제목 없음"}`;
      
      item.appendChild(titleSpan);

      if (ev.url) {
        const linkBtn = document.createElement("a");
        linkBtn.href = ev.url;
        linkBtn.target = "_blank";
        linkBtn.className = "notion-link-btn";
        linkBtn.textContent = "노션 ↗";
        item.appendChild(linkBtn);
      }

      modalBody.appendChild(item);
    });
  }
  modalOverlay.classList.add("active");
}

modalClose.onclick = () => modalOverlay.classList.remove("active");
modalOverlay.onclick = (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove("active"); };

function render() {
  const y = view.getFullYear(), m = view.getMonth();
  const months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];

  title.textContent = `${months[m]} ${y}`;
  daysContainer.innerHTML = "";

  const first = new Date(y, m, 1).getDay();
  const visibleStart = new Date(y, m, 1 - first);
  const visibleEnd = new Date(y, m, 1 - first + 41);

  const dateEventsMap = {};

  for(let w = 0; w < 6; w++) {
    const weekRow = document.createElement("div");
    weekRow.className = "week-row";
    
    const bgCells = document.createElement("div");
    bgCells.className = "bg-cells";
    
    const eventsLayer = document.createElement("div");
    eventsLayer.className = "events-layer";

    for(let d = 0; d < 7; d++) {
      const i = w * 7 + d;
      const cellDate = new Date(y, m, 1 - first + i);
      const num = cellDate.getDate();
      const muted = cellDate.getMonth() !== m;

      const dayEl = document.createElement("div");
      dayEl.className = "day";

      if(muted) dayEl.classList.add("muted");
      if(d === 0) dayEl.classList.add("sun");
      if(d === 6) dayEl.classList.add("sat");

      const today = new Date();
      if(!muted && num === today.getDate() && cellDate.getMonth() === today.getMonth() && cellDate.getFullYear() === today.getFullYear()){
        dayEl.classList.add("todayDate");
      }

      const numEl = document.createElement("div");
      numEl.className = "num";
      numEl.textContent = num;

      dayEl.appendChild(numEl);
      bgCells.appendChild(dayEl);

      dayEl.onclick = () => {
        const key = `${cellDate.getFullYear()}-${cellDate.getMonth()}-${cellDate.getDate()}`;
        openModal(cellDate, dateEventsMap[key] || []);
      };
    }

    weekRow.appendChild(bgCells);
    weekRow.appendChild(eventsLayer);
    daysContainer.appendChild(weekRow);
  }

  const visibleEvents = remoteEvents.filter(ev => {
    if(!ev.date?.start) return false;
    const eventStart = parseLocalDate(ev.date.start);
    const eventEnd = parseLocalDate(ev.date.end || ev.date.start);
    return eventStart <= visibleEnd && eventEnd >= visibleStart;
  });

  visibleEvents.forEach(ev => {
    const eventStart = parseLocalDate(ev.date.start);
    const eventEnd = parseLocalDate(ev.date.end || ev.date.start);
    
    let cur = new Date(eventStart);
    while(cur <= eventEnd) {
      const key = `${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
      if(!dateEventsMap[key]) dateEventsMap[key] = [];
      dateEventsMap[key].push(ev);
      cur.setDate(cur.getDate() + 1);
    }
  });

  const MAX_LANES = 2;
  const lanes = Array.from({length:6}, () => []);
  const hiddenCounts = Array.from({length:42}, () => 0);

  visibleEvents.forEach(ev => {
    const eventStart = parseLocalDate(ev.date.start);
    const eventEnd = parseLocalDate(ev.date.end || ev.date.start);

    let startIndex = getDayDiff(eventStart, visibleStart);
    let endIndex = getDayDiff(eventEnd, visibleStart);

    startIndex = Math.max(0, startIndex);
    endIndex = Math.min(41, endIndex);

    let segmentStart = startIndex;

    while(segmentStart <= endIndex) {
      const week = Math.floor(segmentStart / 7);
      const weekStart = week * 7;
      const weekEnd = weekStart + 6;
      const segmentEnd = Math.min(endIndex, weekEnd);

      let lane = 0;
      while(lane < 30) {
        const overlap = lanes[week].some(item =>
          !(segmentEnd < item.start || segmentStart > item.end) && item.lane === lane
        );
        if(!overlap) break;
        lane++;
      }

      lanes[week].push({ start: segmentStart, end: segmentEnd, lane: lane });

      if(lane >= MAX_LANES) {
        for(let idx = segmentStart; idx <= segmentEnd; idx++) {
          hiddenCounts[idx]++;
        }
      } else {
        const leftPercent = (segmentStart % 7) * (100 / 7);
        const widthPercent = (segmentEnd - segmentStart + 1) * (100 / 7);

        const bar = document.createElement("div");
        bar.className = `event-range ${eventTypeClass(ev.type)}`;

        const isStart = segmentStart === startIndex;
        const isEnd = segmentEnd === endIndex;

        if(isStart && isEnd) bar.classList.add("range-both");
        else if(isStart) bar.classList.add("range-start");
        else if(isEnd) bar.classList.add("range-end");
        else bar.classList.add("range-middle");

        const timeStr = getTimePrefix(ev.date?.start);
        bar.textContent = isStart ? `${timeStr}${eventLabel(ev.type)} · ${ev.title || "제목 없음"}` : "";
        bar.title = `${timeStr}${eventLabel(ev.type)} · ${ev.title || "제목 없음"}`;

        bar.style.left = `calc(${leftPercent}% + 4px)`;
        bar.style.width = `calc(${widthPercent}% - 8px)`;
        bar.style.setProperty('--lane', lane);

        bar.onclick = (e) => {
          e.stopPropagation();
          const key = `${eventStart.getFullYear()}-${eventStart.getMonth()}-${eventStart.getDate()}`;
          openModal(eventStart, dateEventsMap[key] || [ev]);
        };

        const targetLayer = daysContainer.children[week].querySelector('.events-layer');
        targetLayer.appendChild(bar);
      }

      segmentStart = segmentEnd + 1;
    }
  });

  for(let i = 0; i < 42; i++) {
    if(hiddenCounts[i] > 0) {
      const week = Math.floor(i / 7);
      const dayInWeek = i % 7;
      const cellDate = new Date(y, m, 1 - first + i);

      const leftPercent = dayInWeek * (100 / 7);
      const badge = document.createElement("div");
      badge.className = "more-badge";
      badge.textContent = `+${hiddenCounts[i]}개 더보기`;
      badge.style.left = `calc(${leftPercent}% + 6px)`;
      badge.style.width = `calc(${100/7}% - 12px)`;

      badge.onclick = (e) => {
        e.stopPropagation();
        const key = `${cellDate.getFullYear()}-${cellDate.getMonth()}-${cellDate.getDate()}`;
        openModal(cellDate, dateEventsMap[key] || []);
      };

      const targetLayer = daysContainer.children[week].querySelector('.events-layer');
      targetLayer.appendChild(badge);
    }
  }
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth()-1); render(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth()+1); render(); };
document.getElementById("today").onclick = () => { view = new Date(); view.setDate(1); render(); };

addEventListener("resize", resize);
resize(); loadEvents().finally(() => render()); spawnMeteor(); loop();
</script>
</body>
</html>
