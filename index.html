<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Universe — Cosmic Calendar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:#f2f4ff;
  background:#01030b;
}
#space{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,8,.15) 65%,rgba(0,0,8,.55) 100%)}

.calendar{
  position:relative;z-index:2;
  width:min(1150px,calc(100vw - 40px));
  height:min(720px,calc(100vh - 40px));
  margin:20px auto;
  padding:28px 28px 24px;
  border:1px solid rgba(158,125,255,.38);
  border-radius:24px;
  background:rgba(3,7,28,.46);
  backdrop-filter:blur(5px);
  box-shadow:
    0 0 0 1px rgba(60,145,255,.08) inset,
    0 25px 90px rgba(0,0,0,.42),
    0 0 55px rgba(80,75,255,.10);
}
.header{
  height:76px;display:flex;align-items:center;justify-content:center;
  position:relative;border-bottom:1px solid rgba(177,164,255,.22);
  margin-bottom:18px;
}
.title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:38px;letter-spacing:.18em;font-weight:500;
  text-shadow:0 0 18px rgba(205,180,255,.35);
}
.nav{
  position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
}
.nav button{pointer-events:auto;
  width:50px;height:50px;border-radius:50%;
  border:1px solid rgba(155,120,255,.7);
  background:rgba(5,8,35,.45);color:#fff;font-size:32px;line-height:1;
  cursor:pointer;box-shadow:0 0 20px rgba(110,85,255,.12);
}
.nav button:hover{background:rgba(85,80,255,.18);box-shadow:0 0 25px rgba(100,100,255,.3)}
.nav .today{
  width:auto;padding:0 22px;border-radius:28px;font-size:16px;
  position:absolute;right:58px;transform:none;
}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.week{
  height:48px;align-items:center;text-align:center;
  font-size:16px;letter-spacing:.05em;color:#cbd0ef;
}
.week div:first-child{color:#ff4fbd}
.week div:last-child{color:#39aaff}
.days{height:calc(100% - 142px);grid-auto-rows:1fr}
.day{
  position:relative;padding:13px 13px;
  border-right:1px solid rgba(128,139,210,.22);
  border-bottom:1px solid rgba(128,139,210,.22);
  background:rgba(0,6,28,.18);
}
.day:nth-child(7n+1){border-left:1px solid rgba(128,139,210,.22)}
.day:nth-child(-n+7){border-top:1px solid rgba(128,139,210,.22)}
.day:hover{background:rgba(64,80,180,.10)}
.num{font-size:20px;font-weight:400;color:#edf0ff}
.day.sun .num{color:#ff4db9}
.day.sat .num{color:#39aaff}
.muted{opacity:.28}
.event{
  margin-top:14px;display:flex;align-items:center;gap:7px;
  width:max-content;max-width:92%;
  padding:7px 12px;border-radius:18px;
  background:rgba(75,62,150,.30);
  color:#f2f0ff;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dot{width:10px;height:10px;border-radius:50%;background:#35b6ff;box-shadow:0 0 10px #35b6ff;flex:0 0 auto}
.event.pink .dot{background:#ff48b9;box-shadow:0 0 10px #ff48b9}
.event.purple .dot{background:#a45cff;box-shadow:0 0 10px #a45cff}
.todayDate .num{
  width:58px;height:58px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid #9b5cff;
  box-shadow:0 0 15px #6c63ff,0 0 35px rgba(180,70,255,.35);
  background:rgba(76,48,170,.18);
}
@media(max-width:800px){
 .calendar{width:calc(100vw - 18px);height:calc(100vh - 18px);margin:9px;padding:18px}
 .title{font-size:25px;letter-spacing:.1em}
 .nav button{width:40px;height:40px;font-size:25px}
 .nav .today{padding:0 14px;font-size:13px;right:48px}
 .day{padding:8px}.num{font-size:15px}.event{font-size:8px;padding:5px 7px}
 .week{font-size:12px}
}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="vignette"></div>

<section class="calendar">
  <header class="header">
    <div class="nav">
      <button id="prev" aria-label="previous month">‹</button>
      <button id="next" aria-label="next month">›</button>
      <button id="today" class="today">Today</button>
    </div>
    <div id="title" class="title"></div>
  </header>

  <div class="week">
    <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
  </div>
  <div id="days" class="days"></div>
</section>

<script>
const canvas=document.getElementById("space"),ctx=canvas.getContext("2d");
let W,H,D,stars=[],clouds=[],meteors=[],t=0;
const rnd=(a,b)=>a+Math.random()*(b-a);

function resize(){
  W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);
  canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.min(360,Math.max(130,W*H/9000))},()=>({
    x:Math.random()*W,y:Math.random()*H,r:rnd(.25,1.15),a:rnd(.25,.9),p:Math.random()*6.28
  }));
  clouds=Array.from({length:36},()=>({
    x:rnd(-100,W+100),y:rnd(-50,H+50),r:rnd(35,115),pink:Math.random()<.5
  }));
}

function galaxy(){
  const cx=W*.54,cy=H*.48,base=Math.min(W,H),rx=base*.43,ry=base*.17;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(-.17);ctx.globalCompositeOperation="screen";

  let halo=ctx.createRadialGradient(0,0,0,0,0,rx*1.2);
  halo.addColorStop(0,"rgba(255,100,225,.19)");
  halo.addColorStop(.25,"rgba(75,125,255,.12)");
  halo.addColorStop(.6,"rgba(100,55,230,.035)");
  halo.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,rx*1.2,0,7);ctx.fill();ctx.restore();

  for(let arm=0;arm<2;arm++){
    ctx.beginPath();
    for(let i=0;i<760;i++){
      const q=i/759,a=q*Math.PI*6+arm*Math.PI+.16*Math.sin(q*12),r=rx*(.07+q*.93);
      const px=Math.cos(a)*r,py=Math.sin(a)*r*(ry/rx);
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.strokeStyle=arm===0?"rgba(55,150,255,.18)":"rgba(255,60,205,.16)";
    ctx.lineWidth=base*.05;
    ctx.shadowBlur=base*.06;
    ctx.shadowColor=arm===0?"rgba(40,140,255,.38)":"rgba(255,50,205,.35)";
    ctx.stroke();ctx.shadowBlur=0;
  }

  let band=ctx.createRadialGradient(0,0,0,0,0,rx);
  band.addColorStop(0,"rgba(255,255,255,.78)");
  band.addColorStop(.08,"rgba(255,165,235,.43)");
  band.addColorStop(.2,"rgba(70,145,255,.13)");
  band.addColorStop(.65,"rgba(50,80,220,.02)");
  band.addColorStop(1,"rgba(0,0,0,0)");
  ctx.save();ctx.scale(1,ry/rx);ctx.fillStyle=band;ctx.beginPath();ctx.arc(0,0,rx,0,7);ctx.fill();ctx.restore();

  const core=ctx.createRadialGradient(0,0,0,0,0,base*.105);
  core.addColorStop(0,"rgba(255,255,255,.98)");
  core.addColorStop(.13,"rgba(255,225,252,.92)");
  core.addColorStop(.34,"rgba(255,95,220,.42)");
  core.addColorStop(.7,"rgba(80,100,255,.08)");
  core.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,base*.105,0,7);ctx.fill();
  ctx.restore();
}

function background(){
  let g=ctx.createRadialGradient(W*.5,H*.48,0,W*.5,H*.48,Math.max(W,H)*.8);
  g.addColorStop(0,"#090a25");g.addColorStop(.45,"#030820");g.addColorStop(1,"#010208");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.globalCompositeOperation="screen";
  for(const p of clouds){
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    if(p.pink){g.addColorStop(0,"rgba(255,45,195,.055)");g.addColorStop(1,"rgba(255,45,195,0)")}
    else{g.addColorStop(0,"rgba(35,125,255,.06)");g.addColorStop(1,"rgba(35,125,255,0)")}
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  }

  for(const s of stars){
    ctx.fillStyle=`rgba(225,235,255,${s.a*(.72+.28*Math.sin(t*1.7+s.p))})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();
  }
  galaxy();
}

function spawnMeteor(){
  if(meteors.length>=3)return;
  const a=rnd(.38,.68),speed=rnd(7,12);
  meteors.push({
    x:rnd(-80,W),y:rnd(-80,H*.35),vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
    life:0,max:rnd(42,70),len:rnd(50,115),
    color:["#3ca8ff","#ff43bd","#9d62ff","#63eaff"][Math.floor(Math.random()*4)]
  });
}
function meteorsDraw(){
  ctx.globalCompositeOperation="screen";
  for(const m of meteors){
    m.x+=m.vx;m.y+=m.vy;m.life++;
    const mag=Math.hypot(m.vx,m.vy),ux=m.vx/mag,uy=m.vy/mag;
    const g=ctx.createLinearGradient(m.x-ux*m.len,m.y-uy*m.len,m.x,m.y);
    g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(.72,m.color);g.addColorStop(1,"#fff");
    ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.beginPath();
    ctx.moveTo(m.x-ux*m.len,m.y-uy*m.len);ctx.lineTo(m.x,m.y);ctx.stroke();
  }
  meteors=meteors.filter(m=>m.life<m.max&&m.x<W+180&&m.y<H+180);
  if(Math.random()<.007)spawnMeteor();
}
function loop(){
  t+=.016;background();meteorsDraw();ctx.globalCompositeOperation="source-over";requestAnimationFrame(loop);
}


const API_URL = "https://my-universe-notion-api.121212jms.workers.dev/calendar";
let remoteEvents = [];

async function loadEvents() {
  try {
    const response = await fetch(API_URL);
    if (!response.ok) throw new Error(`API ${response.status}`);
    const data = await response.json();
    if (!data.ok) throw new Error(data.error || "API error");
    remoteEvents = Array.isArray(data.events) ? data.events : [];
  } catch (error) {
    console.error("Calendar API error:", error);
    remoteEvents = [];
  }
}
function eventTypeClass(type) {
  if (type === "exam") return "pink";
  if (type === "calendar") return "purple";
  return "";
}
function eventLabel(type) {
  if (type === "exam") return "시험";
  if (type === "calendar") return "일정";
  return "과제";
}
function eventsForDate(year, month, day) {
  const target = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
  return remoteEvents.filter(ev => ev.date?.start && String(ev.date.start).slice(0,10) === target);
}

const title=document.getElementById("title"),days=document.getElementById("days");
let view=new Date();view.setDate(1);

function eventEl(text,type){
 const e=document.createElement("div");e.className="event "+(type||"");
 e.innerHTML=`<span class="dot"></span>${text}`;return e;
}
function render(){
 const y=view.getFullYear(),m=view.getMonth();
 const months=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
 title.textContent=`${months[m]} ${y}`;
 days.innerHTML="";
 const first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();

 for(let i=0;i<42;i++){
   let n=i-first+1,muted=n<=0||n>count,num=n;
   if(n<=0)num=prev+n;
   if(n>count)num=n-count;
   const d=document.createElement("div");d.className="day";
   if(muted)d.classList.add("muted");
   if(i%7===0)d.classList.add("sun");
   if(i%7===6)d.classList.add("sat");

   const today=new Date();
   if(!muted&&num===today.getDate()&&m===today.getMonth()&&y===today.getFullYear())d.classList.add("todayDate");

   const numEl=document.createElement("div");
   numEl.className="num";numEl.textContent=num;d.appendChild(numEl);

   if(!muted){
     const events=eventsForDate(y,m,num);
     for(const ev of events.slice(0,3)){
       d.appendChild(eventEl(
         `${eventLabel(ev.type)} · ${ev.title || "제목 없음"}`,
         eventTypeClass(ev.type)
       ));
     }
     if(events.length>3){
       const more=document.createElement("div");
       more.className="event";
       more.innerHTML=`<span class="dot"></span>+${events.length-3}개`;
       d.appendChild(more);
     }
   }
   days.appendChild(d);
 }
}

document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);render()};
document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);render()};
document.getElementById("today").onclick=()=>{view=new Date();view.setDate(1);render()};

addEventListener("resize",resize);
resize();loadEvents().finally(()=>render());spawnMeteor();loop();
</script>
</body>
</html>
